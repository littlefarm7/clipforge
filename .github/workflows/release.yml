# Gera os pacotes de Linux, Windows e macOS e publica uma Release quando uma tag v* é enviada
# ou quando o workflow é disparado manualmente com o campo "tag" preenchido (ex.: v0.2.0).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versão a publicar (ex.: v0.2.0). Vazio = só compila."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: |
          pip install ziglang==0.13.0
          cargo install --locked cargo-zigbuild
          cargo install --locked apple-codesign --bin rcodesign
          sudo apt-get update && sudo apt-get install -y zip

      - name: Compilar pacotes
        run: WORK=$RUNNER_TEMP/build ./packaging/build-all.sh

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "ClipForge $TAG" --generate-notes \
            || gh release upload "$TAG" dist/* --clobber

      - name: Guardar pacotes
        if: "!startsWith(github.ref, 'refs/tags/') && inputs.tag == ''"
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-pacotes
          path: dist/*
